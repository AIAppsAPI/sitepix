[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sitepix"
version = "0.1.0"
description = "Website ready images from a local model on Apple Silicon, as a command line tool and an MCP server for AI assistants."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Crinigan", email = "paul@aiappsapi.com" }]
keywords = ["image-generation", "apple-silicon", "mlx", "mflux", "mcp", "webp", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10.0",
    "mcp>=1.2",
    "mflux; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://www.aiappsapi.com/articles/local-ai-image-mac/"
Repository = "https://github.com/AIAppsAPI/sitepix"

[project.scripts]
sitepix = "sitepix.cli:main"

[tool.setuptools.packages.find]
include = ["sitepix*"]
